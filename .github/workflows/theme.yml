name: Theme package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  generate:
    name: Generate and check drift
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:drift
      - run: node scripts/check-dark-divider-contract.mjs

  version:
    name: Validate release version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require a stable SemVer tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be stable SemVer: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

  package:
    if: github.ref_type != 'tag'
    needs: generate
    permissions:
      contents: read
    uses: jaunder-org/jaunder/.github/workflows/theme-repository.yml@bfb02febb81212258aff1c10bbdf5248fa864cc5
    with:
      jaunder-revision: bfb02febb81212258aff1c10bbdf5248fa864cc5
      theme-directory: .

  release:
    if: github.ref_type == 'tag'
    needs: [generate, version]
    permissions:
      contents: write
    uses: jaunder-org/jaunder/.github/workflows/theme-repository.yml@bfb02febb81212258aff1c10bbdf5248fa864cc5
    with:
      jaunder-revision: bfb02febb81212258aff1c10bbdf5248fa864cc5
      theme-directory: .
